services:
  app:
    build: .
    ports:
      - "5001:5001"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./templates:/app/templates
      - ./tests:/app/tests
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
